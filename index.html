        /* Modern 3D & Elevation Utilities */
        .card-3d {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(245, 248, 245, 0.85));
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03), inset 0 1px 1px 0 rgba(255, 255, 255, 0.8);

            border: 1px solid #991b1b;

    <script>
        /**
         * SHANKAR BEEJ BHANDAR - Database & Business Logic Engine
         */
        class ShopDB {
            constructor() {
                this.dbName = 'ShankarBeejBhandarDB';
                this.dbVersion = 1;
                this.db = null;
            }

            async init() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(this.dbName, this.dbVersion);

                    request.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        const stores = [
                            'products', 'distributors', 'customers', 
                            'purchases', 'sales', 'payments', 
                            'stock_ledger', 'settings'
                        ];

                        stores.forEach(store => {
                            if (!db.objectStoreNames.contains(store)) {
                                db.createObjectStore(store, { keyPath: 'id' });
                            }
                        });
                    };

                    request.onsuccess = (e) => {
                        this.db = e.target.result;
                        resolve(this.db);
                    };

                    request.onerror = (e) => reject(e.target.error);
                });
            }

            async getAll(storeName) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(storeName, 'readonly');
                    const store = tx.objectStore(storeName);
                    const req = store.getAll();
                    req.onsuccess = () => resolve(req.result || []);
                    req.onerror = () => reject(req.error);
                });
            }

            async get(storeName, id) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(storeName, 'readonly');
                    const store = tx.objectStore(storeName);
                    const req = store.get(id);
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.error);
                });
            }

            async save(storeName, item) {
                if (!item.id) item.id = 'ID_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(storeName, 'readwrite');
                    const store = tx.objectStore(storeName);
                    const req = store.put(item);
                    req.onsuccess = () => resolve(item);
                    req.onerror = () => reject(req.error);
                });
            }

            async delete(storeName, id) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(storeName, 'readwrite');
                    const store = tx.objectStore(storeName);
                    const req = store.delete(id);
                    req.onsuccess = () => resolve(true);
                    req.onerror = () => reject(req.error);
                });
            }

            async clearAll() {
                const stores = ['products', 'distributors', 'customers', 'purchases', 'sales', 'payments', 'stock_ledger'];
                for (let s of stores) {
                    const tx = this.db.transaction(s, 'readwrite');
                    tx.objectStore(s).clear();
                }
            }
        }

        // Main Application Controller
        class Application {
            constructor() {
                this.db = new ShopDB();
                this.currentView = 'dashboard';
                this.settings = {
                    shopName: 'SHANKAR BEEJ BHANDAR',
                    address: 'Main Market, Agricultural Zone, District Center',
                    phone: '+91 98765 43210',
                    gstin: '09AAAAA0000A1Z5',
                    allowNegativeStock: false
                };
            }

            async init() {
                await this.db.init();
                
                // Load Settings
                const savedSettings = await this.db.get('settings', 'config');
                if (savedSettings) this.settings = { ...this.settings, ...savedSettings };

                // Register Service Worker for PWA
                if ('serviceWorker' in navigator) {
                    const swCode = `
                        self.addEventListener('install', e => e.waitUntil(self.skipWaiting()));
                        self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
                        self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => new Response('Offline'))));
                    `;
                    const blob = new Blob([swCode], { type: 'application/javascript' });
                    navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
                }

                // Initial Route
                this.navigate('dashboard');
                
                // Global Event Listeners
                window.addEventListener('online', () => this.updateOnlineStatus());
                window.addEventListener('offline', () => this.updateOnlineStatus());
            }

            updateOnlineStatus() {
                const badge = document.getElementById('online-status-badge');
                if (navigator.onLine) {
                    badge.className = 'px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 flex items-center gap-1';
                    badge.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span><span>Online</span>';
                } else {
                    badge.className = 'px-2.5 py-1 rounded-full text-xs font-semibold bg-amber-500/20 text-amber-300 border border-amber-500/30 flex items-center gap-1';
                    badge.innerHTML = '<span class="w-2 h-2 rounded-full bg-amber-400"></span><span>Offline Mode</span>';
                }
            }

            toast(message, type = 'success') {
                const container = document.getElementById('toast-container');
                const toast = document.createElement('div');
                const bgColor = type === 'success' ? 'bg-slate-900 text-white border-agri-500' : 'bg-red-900 text-white border-red-500';
                const icon = type === 'success' ? 'fa-circle-check text-emerald-400' : 'fa-triangle-exclamation text-red-400';
                
                toast.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl border-l-4 ${bgColor} shadow-xl text-sm font-medium transform transition-all duration-300 translate-y-2 opacity-0`;
                toast.innerHTML = `<i class="fa-solid ${icon} text-lg"></i><span>${message}</span>`;
                
                container.appendChild(toast);
                setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
                setTimeout(() => {
                    toast.classList.add('opacity-0', 'translate-y-2');
                    setTimeout(() => toast.remove(), 300);
                }, 3500);
            }

            navigate(viewName, params = null) {
                this.currentView = viewName;
                
                // Highlight active Nav
                document.querySelectorAll('.nav-item, .mobile-nav-item').forEach(el => {
                    const active = el.dataset.tab === viewName;
                    if (el.classList.contains('nav-item')) {
                        el.className = `nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-semibold transition ${active ? 'bg-agri-700 text-white shadow-md' : 'text-slate-700 hover:bg-agri-50 hover:text-agri-800'}`;
                    } else if (el.classList.contains('mobile-nav-item')) {
                        el.className = `mobile-nav-item py-1 flex flex-col items-center ${active ? 'text-agri-700 font-bold' : 'text-slate-500'}`;
                    }
                });

                const container = document.getElementById('view-container');
                container.innerHTML = `<div class="p-8 text-center text-slate-400"><i class="fa-solid fa-spinner fa-spin text-3xl mb-2"></i><p>Loading module...</p></div>`;

                setTimeout(async () => {
                    switch (viewName) {
                        case 'dashboard': await this.renderDashboard(); break;
                        case 'pos': await this.renderPOS(); break;
                        case 'purchases': await this.renderPurchases(); break;
                        case 'inventory': await this.renderInventory(); break;
                        case 'distributors': await this.renderDistributors(params); break;
                        case 'customers': await this.renderCustomers(params); break;
                        case 'gst': await this.renderGST(); break;
                        case 'reports': await this.renderReports(); break;
                        case 'settings': await this.renderSettings(); break;
                    }
                }, 50);
            }

            openModal(title, bodyHTML, footerButtons = '') {
                const modal = document.getElementById('global-modal');
                const content = document.getElementById('global-modal-content');
                
                content.innerHTML = `
                    <div class="px-5 py-4 bg-slate-900 text-white flex items-center justify-between border-b border-slate-800">
                        <h3 class="font-bold text-lg flex items-center gap-2">${title}</h3>
                        <button onclick="app.closeModal()" class="text-slate-400 hover:text-white p-1 rounded-lg transition"><i class="fa-solid fa-xmark text-xl"></i></button>
                    </div>
                    <div class="p-5 overflow-y-auto flex-1">${bodyHTML}</div>
                    ${footerButtons ? `<div class="px-5 py-3.5 bg-slate-50 border-t border-slate-200 flex justify-end gap-2">${footerButtons}</div>` : ''}
                `;

                modal.classList.remove('hidden');
                setTimeout(() => {
                    modal.classList.remove('opacity-0');
                    content.classList.remove('scale-95');
                }, 10);
            }

            closeModal() {
                const modal = document.getElementById('global-modal');
                const content = document.getElementById('global-modal-content');
                
                modal.classList.add('opacity-0');
                content.classList.add('scale-95');
                setTimeout(() => modal.classList.add('hidden'), 200);
            }

            openMobileMoreMenu() {
                document.getElementById('mobile-more-drawer').classList.remove('hidden');
            }

            closeMobileMoreMenu() {
                document.getElementById('mobile-more-drawer').classList.add('hidden');
            }

            async renderDashboard() {
                const products = await this.db.getAll('products');
                const sales = await this.db.getAll('sales');
                const purchases = await this.db.getAll('purchases');
                const customers = await this.db.getAll('customers');
                const distributors = await this.db.getAll('distributors');

                const todayStr = new Date().toISOString().split('T')[0];

                // Calculations
                const todaySales = sales.filter(s => s.date === todayStr).reduce((acc, s) => acc + (s.netTotal || 0), 0);
                const todayPurchases = purchases.filter(p => p.date === todayStr).reduce((acc, p) => acc + (p.netAmount || 0), 0);
                
                const customerDue = customers.reduce((acc, c) => acc + (c.outstanding || 0), 0);
                const distributorDue = distributors.reduce((acc, d) => acc + (d.outstanding || 0), 0);

                const totalStockValue = products.reduce((acc, p) => acc + ((p.currentStock || 0) * (p.purchasePrice || 0)), 0);
                const lowStockItems = products.filter(p => (p.currentStock || 0) <= (p.minStock || 5));

            renderCategoryChart(products) {
                const categoryTotals = {};
                products.forEach(p => {
                    const cat = p.category || 'Other';
                    const val = (p.currentStock || 0) * (p.purchasePrice || 0);
                    categoryTotals[cat] = (categoryTotals[cat] || 0) + val;
                });

                const categories = Object.keys(categoryTotals);
                const values = Object.values(categoryTotals);
                const maxVal = Math.max(...values, 1000);

                if (categories.length === 0) return '<p class="text-slate-400 text-sm">No inventory data to chart.</p>';

                return `
                    <div class="w-full space-y-3">
                        ${categories.map((cat, idx) => {
                            const val = categoryTotals[cat];
                            const pct = Math.round((val / maxVal) * 100);
                            const colors = ['bg-emerald-500', 'bg-blue-500', 'bg-amber-500', 'bg-purple-500', 'bg-rose-500', 'bg-teal-500'];
                            const color = colors[idx % colors.length];
                            return `
                                <div>
                                    <div class="flex justify-between text-xs font-bold mb-1">
                                        <span class="text-slate-700">${cat}</span>
                                        <span class="text-slate-600">₹${val.toLocaleString('en-IN')}</span>
                                    </div>
                                    <div class="w-full h-3 bg-slate-100 rounded-full overflow-hidden">
                                        <div class="h-full ${color} rounded-full transition-all duration-500" style="width: ${pct}%"></div>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
            }

            async deleteDistributor(distributorId) {
                const mode = document.querySelector('input[name="delete_dist_mode"]:checked')?.value || 'unlink';

                if (mode === 'purge') {
                    const allPurchases = await this.db.getAll('purchases');
                    const allPayments = await this.db.getAll('payments');

                    const distPurchases = allPurchases.filter(p => p.distributorId === distributorId);
                    const distPayments = allPayments.filter(p => p.distributorId === distributorId);

                    for (let p of distPurchases) await this.db.delete('purchases', p.id);
                    for (let pay of distPayments) await this.db.delete('payments', pay.id);

                await this.db.delete('distributors', distributorId);
                this.closeModal();
                this.toast('Distributor deleted successfully!');
                this.renderDistributors();

            async renderDistributorAccountLedger(distributorId) {
                const distributor = await this.db.get('distributors', distributorId);
                if (!distributor) {
                    this.renderDistributors();
                    return;
                }
                const allPurchases = await this.db.getAll('purchases');
                const allPayments = await this.db.getAll('payments');

                const purchases = allPurchases.filter(p => p.distributorId === distributorId);
                const payments = allPayments.filter(p => p.distributorId === distributorId);

                // Build Ledger Entries Chronologically
                let ledger = [];
                if (distributor.openingBalance > 0) {
                    ledger.push({
                        date: 'Opening',
                        desc: 'Opening Balance',
                        debit: distributor.openingBalance, // We owe them
                        credit: 0,
                        type: 'OPENING'
                    });
                }

                purchases.forEach(p => {
                    ledger.push({
                        date: p.date,
                        desc: `Purchase Bill #${p.billNo} ${p.stockStatus === 'PENDING' ? '(Pending Items)' : ''}`,
                        debit: p.netAmount || 0,
                        credit: 0,
                        refId: p.id,
                        type: 'PURCHASE'
                    });
                });

                payments.forEach(pay => {
                    ledger.push({
                        date: pay.date,
                        desc: `Payment (${pay.method}) ${pay.note ? '- ' + pay.note : ''}`,
                        debit: 0,
                        credit: pay.amount || 0,
                        refId: pay.id,
                        type: 'PAYMENT'
                    });
                });

                // Sort by Date
                ledger.sort((a, b) => (a.date > b.date ? 1 : -1));

                // Calculate Running Balance
                let runningBalance = 0;
                ledger.forEach(entry => {
                    runningBalance += (entry.debit - entry.credit);
                    entry.balance = runningBalance;

            confirmDeletePurchaseBill(purchaseId, redirectDistributorId = null) {
                this.db.get('purchases', purchaseId).then(purchase => {
                    if (!purchase) return;

                    const html = `
                        <div class="space-y-4">
                            <div class="p-3 bg-red-50 border border-red-200 rounded-xl text-red-800 text-sm">
                                <i class="fa-solid fa-triangle-exclamation text-red-600 mr-1"></i> Confirm deletion of Purchase Bill <strong>#${purchase.billNo}</strong> (Amount: ₹${purchase.netAmount})?
                            </div>
                            ${purchase.stockStatus === 'UPDATED' && purchase.items && purchase.items.length > 0 ? `
                                <div class="p-3 bg-amber-50 border border-amber-200 rounded-xl text-xs text-amber-900 space-y-1">
                                    <strong>Stock Reversal Option:</strong>
                                    <label class="flex items-center gap-2 cursor-pointer mt-1">
                                        <input type="checkbox" id="revert_purchase_stock" checked class="rounded text-agri-600"> Automatically deduct added product quantities back from inventory
                                    </label>
                                </div>
                            ` : ''}
                        </div>
                    `;

                    const buttons = `
                        <button onclick="app.closeModal()" class="px-4 py-2 border border-slate-300 rounded-xl text-sm font-bold text-slate-600">Cancel</button>
                        <button onclick="app.deletePurchaseBill('${purchaseId}', '${redirectDistributorId || ''}')" class="btn-3d-danger text-white px-5 py-2 rounded-xl text-sm font-bold"><i class="fa-solid fa-trash-can mr-1"></i> Delete Bill</button>
                    `;

                    this.openModal('Delete Purchase Bill', html, buttons);
                });
            }

            async deletePurchaseBill(purchaseId, redirectDistributorId = '') {
                const purchase = await this.db.get('purchases', purchaseId);
                if (!purchase) return;

                const revertStock = document.getElementById('revert_purchase_stock')?.checked;

                if (revertStock && purchase.items) {
                    for (let item of purchase.items) {
                        const prod = await this.db.get('products', item.productId);
                        if (prod) {
                            prod.currentStock = Math.max(0, (prod.currentStock || 0) - item.qty);
                            await this.db.save('products', prod);

                            await this.db.save('stock_ledger', {
                                date: new Date().toISOString().split('T')[0],
                                productId: prod.id,
                                productName: prod.name,
                                type: 'Purchase Deleted (Reversal)',
                                ref: `Bill #${purchase.billNo}`,
                                inQty: 0,
                                outQty: item.qty,
                                balance: prod.currentStock,
                                createdAt: new Date().toISOString()
                            });
                        }
                    }
                }

                await this.db.delete('purchases', purchaseId);
                this.closeModal();
                this.toast('Purchase Bill deleted!');

                if (redirectDistributorId) {
                    this.renderDistributorAccountLedger(redirectDistributorId);
                } else {
                    this.renderPurchases();
                }
            }

            addPurchaseItemRow(item = null) {
                const container = document.getElementById('purchase-items-container');
                const rowId = 'p_row_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
                const products = this.windowProductsCache || [];

                const div = document.createElement('div');
                div.id = rowId;
                div.className = "grid grid-cols-12 gap-2 items-center bg-white p-2 rounded-lg border border-slate-200 text-xs";
                div.innerHTML = `
                    <div class="col-span-5">
                        <select class="p-prod-id w-full p-1.5 border border-slate-300 rounded-md font-medium" onchange="app.calcPurchaseRowTotal('${rowId}')">
                            <option value="">-- Select Product --</option>
                            ${products.map(p => `<option value="${p.id}" ${item && item.productId === p.id ? 'selected' : ''}>${p.name} (${p.unit})</option>`).join('')}
                        </select>
                    </div>
                    <div class="col-span-2">
                        <input type="number" class="p-qty w-full p-1.5 border border-slate-300 rounded-md font-bold" placeholder="Qty" value="${item ? item.qty : ''}" oninput="app.calcPurchaseRowTotal('${rowId}')">
                    </div>
                    <div class="col-span-2">
                        <input type="number" step="0.01" class="p-rate w-full p-1.5 border border-slate-300 rounded-md font-medium" placeholder="Rate" value="${item ? item.rate : ''}" oninput="app.calcPurchaseRowTotal('${rowId}')">

                        ₹${item ? (item.qty * item.rate) : 0}
                    </div>
                    <div class="col-span-1 text-center">
                        <button type="button" onclick="document.getElementById('${rowId}').remove(); app.calcPurchaseGrandTotal();" class="text-red-500 hover:text-red-700 p-1"><i class="fa-solid fa-trash"></i></button>

                `;

                container.appendChild(div);
            }

            calcPurchaseRowTotal(rowId) {
                const row = document.getElementById(rowId);
                const qty = parseFloat(row.querySelector('.p-qty').value) || 0;
                const rate = parseFloat(row.querySelector('.p-rate').value) || 0;
                const amount = qty * rate;
                row.querySelector('.p-amount').innerText = '₹' + amount.toFixed(2);
                this.calcPurchaseGrandTotal();
            }

            calcPurchaseGrandTotal() {
                let total = 0;
                document.querySelectorAll('#purchase-items-container > div').forEach(row => {
                    const qty = parseFloat(row.querySelector('.p-qty').value) || 0;
                    const rate = parseFloat(row.querySelector('.p-rate').value) || 0;
                    total += (qty * rate);
                });

                if (total > 0) {
                    document.getElementById('purNetAmount').value = total.toFixed(2);
                }
            }

            async savePurchaseBill(e) {
                e.preventDefault();
                const distributorId = document.getElementById('purDistributorId').value;
                const date = document.getElementById('purDate').value;
                const billNo = document.getElementById('purBillNo').value.trim();
                const netAmount = parseFloat(document.getElementById('purNetAmount').value);

                // Collect Items if entered
                const items = [];
                document.querySelectorAll('#purchase-items-container > div').forEach(row => {
                    const productId = row.querySelector('.p-prod-id').value;
                    const qty = parseFloat(row.querySelector('.p-qty').value) || 0;
                    const rate = parseFloat(row.querySelector('.p-rate').value) || 0;
                    if (productId && qty > 0) {
                        items.push({ productId, qty, rate, amount: qty * rate });
                    }
                });

                const hasItems = items.length > 0;

                const purchase = {
                    distributorId,
                    date,
                    billNo,
                    netAmount,
                    items,
                    stockStatus: hasItems ? 'UPDATED' : 'PENDING',
                    createdAt: new Date().toISOString()
                };

                const savedPurchase = await this.db.save('purchases', purchase);

                // If Items Provided, Update Inventory Stock Immediately
                if (hasItems) {
                    await this.processPurchaseStockUpdate(savedPurchase);
                }

                this.closeModal();
                this.toast('Purchase Bill saved successfully!');
                this.renderPurchases();
            }

                const purchase = await this.db.get('purchases', purchaseId);
                const products = await this.db.getAll('products');
                this.windowProductsCache = products;

                const html = `
                    <div class="space-y-4">
                        <div class="bg-amber-50 border border-amber-200 rounded-xl p-3 text-xs text-amber-900">

                        </div>
                        <p class="text-xs font-bold text-slate-700 uppercase">Add Received Inventory Products:</p>
                        
                        <div id="purchase-items-container" class="space-y-2 max-h-[300px] overflow-y-auto">
                            <!-- Items Rows -->
                        </div>
                        <button type="button" onclick="app.addPurchaseItemRow()" class="text-xs bg-agri-100 hover:bg-agri-200 text-agri-800 px-3 py-1.5 rounded-lg font-bold w-full"><i class="fa-solid fa-plus"></i> Add Product Item</button>
                    </div>
                `;

                const buttons = `
                    <button onclick="app.closeModal()" class="px-4 py-2 border border-slate-300 rounded-xl text-sm font-bold text-slate-600">Cancel</button>
                    <button onclick="app.confirmAddItemsToPurchase('${purchaseId}')" class="btn-3d text-white px-5 py-2 rounded-xl text-sm font-bold">Update Inventory Stock</button>
                `;

                this.addPurchaseItemRow();
            }

            async confirmAddItemsToPurchase(purchaseId) {
                const purchase = await this.db.get('purchases', purchaseId);
                const items = [];
                document.querySelectorAll('#purchase-items-container > div').forEach(row => {
                    const productId = row.querySelector('.p-prod-id').value;
                    const qty = parseFloat(row.querySelector('.p-qty').value) || 0;
                    const rate = parseFloat(row.querySelector('.p-rate').value) || 0;
                    if (productId && qty > 0) {
                        items.push({ productId, qty, rate, amount: qty * rate });
                    }
                });

                if (items.length === 0) {
                    this.toast('Please add at least one valid product item.', 'error');
                    return;
                }

                purchase.items = items;
                purchase.stockStatus = 'UPDATED';
                await this.db.save('purchases', purchase);

                await this.processPurchaseStockUpdate(purchase);

                this.closeModal();
                this.toast('Stock updated in inventory!');
                this.renderPurchases();
            }

            async processPurchaseStockUpdate(purchase) {
                for (let item of purchase.items) {
                    const prod = await this.db.get('products', item.productId);
                    if (prod) {
                        const oldStock = prod.currentStock || 0;
                        prod.currentStock = oldStock + item.qty;
                        if (item.rate > 0) prod.purchasePrice = item.rate; // Update latest purchase rate
                        await this.db.save('products', prod);

                        // Save Stock Ledger Movement Record
                        await this.db.save('stock_ledger', {
                            date: purchase.date,
                            productId: prod.id,
                            productName: prod.name,
                            type: 'Purchase In',
                            ref: `Bill #${purchase.billNo}`,
                            inQty: item.qty,
                            outQty: 0,
                            balance: prod.currentStock,
                            createdAt: new Date().toISOString()
                        });
                    }
                }
            }

                const html = `

                    const products = await this.db.getAll('products');
                    const distributors = await this.db.getAll('distributors');

                    setTimeout(() => {

                        document.getElementById('purBillNo').value = 'OCR-' + Math.floor(1000 + Math.random() * 9000);
                        document.getElementById('purNetAmount').value = '12500';

                            this.addPurchaseItemRow({ productId: sampleProduct.id, qty: 10, rate: 1250 });

            async saveProduct(e, productId) {
                e.preventDefault();
                const name = document.getElementById('pName').value.trim();
                const category = document.getElementById('pCategory').value;
                const unit = document.getElementById('pUnit').value;
                const purchasePrice = parseFloat(document.getElementById('pPurchasePrice').value) || 0;
                const salePrice = parseFloat(document.getElementById('pSalePrice').value) || 0;
                const openingStock = parseFloat(document.getElementById('pOpeningStock').value) || 0;
                const minStock = parseFloat(document.getElementById('pMinStock').value) || 5;
                const gstRate = parseFloat(document.getElementById('pGstRate').value) || 0;

                const item = {
                    id: productId || undefined,
                    name,
                    category,
                    unit,
                    purchasePrice,
                    salePrice,
                    minStock,
                    gstRate,
                    updatedAt: new Date().toISOString()
                };

                if (!productId) {
                    item.currentStock = openingStock;
                }

                const savedProd = await this.db.save('products', item);

                if (!productId && openingStock > 0) {
                    await this.db.save('stock_ledger', {
                        date: new Date().toISOString().split('T')[0],
                        productId: savedProd.id,
                        productName: savedProd.name,
                        type: 'Opening Stock',
                        ref: 'Initial Entry',
                        inQty: openingStock,
                        outQty: 0,
                        balance: openingStock,
                        createdAt: new Date().toISOString()
                    });
                }

                this.closeModal();
                this.toast('Product saved successfully!');
                this.renderInventory();
            }

            async saveStockAdjustment(e) {
                e.preventDefault();
                const productId = document.getElementById('adjProdId').value;
                const type = document.getElementById('adjType').value;
                const qty = parseFloat(document.getElementById('adjQty').value);
                const reason = document.getElementById('adjReason').value.trim();

                const prod = await this.db.get('products', productId);
                if (!prod) return;

                if (type === 'OUT' && (prod.currentStock < qty) && !this.settings.allowNegativeStock) {
                    this.toast(`Insufficient stock! Available: ${prod.currentStock} ${prod.unit}`, 'error');
                    return;
                }

                if (type === 'IN') {
                    prod.currentStock += qty;
                } else {
                    prod.currentStock -= qty;
                }

                await this.db.save('products', prod);

                await this.db.save('stock_ledger', {
                    date: new Date().toISOString().split('T')[0],
                    productId: prod.id,
                    productName: prod.name,
                    type: type === 'IN' ? 'Adjustment In' : 'Adjustment Out',
                    ref: reason,
                    inQty: type === 'IN' ? qty : 0,
                    outQty: type === 'OUT' ? qty : 0,
                    balance: prod.currentStock,
                    createdAt: new Date().toISOString()
                });

                this.closeModal();
                this.toast('Stock adjusted successfully!');
                this.renderInventory();
            }

            filterPOSProducts() {
                const query = document.getElementById('pos-product-search').value.toLowerCase();
                document.querySelectorAll('#pos-product-grid > div').forEach(card => {

            async addItemToCart(productId) {
                const product = await this.db.get('products', productId);
                if (!product) return;

                const existing = this.cart.find(c => c.productId === productId);
                if (existing) {
                    if (existing.qty + 1 > product.currentStock && !this.settings.allowNegativeStock) {
                        this.toast(`Cannot exceed available stock (${product.currentStock} ${product.unit})`, 'error');
                        return;
                    }
                    existing.qty += 1;
                } else {
                    if (product.currentStock <= 0 && !this.settings.allowNegativeStock) {
                        this.toast('Product is out of stock!', 'error');
                        return;
                    }
                    this.cart.push({
                        productId: product.id,
                        name: product.name,
                        unit: product.unit,
                        category: product.category,
                        rate: product.salePrice || 0,
                        gstRate: product.gstRate || 0,
                        qty: 1
                    });
                }

                this.renderCartItems();
            }

            renderCartItems() {
                const container = document.getElementById('cart-items-list');
                if (this.cart.length === 0) {
                    container.innerHTML = `<p class="text-center text-slate-400 text-xs py-10">Cart is empty. Click items on the left to add.</p>`;
                    this.updateCartTotals();
                    return;
                }

                container.innerHTML = this.cart.map((item, idx) => `
                    <div class="flex items-center justify-between bg-slate-50 p-2 rounded-xl border border-slate-200 text-xs">
                        <div class="flex-1">
                            <div class="font-bold text-slate-800">${item.name}</div>
                            <div class="text-[10px] text-slate-500">₹${item.rate} / ${item.unit}</div>
                        </div>
                        <div class="flex items-center gap-2">
                            <input type="number" min="1" value="${item.qty}" onchange="app.updateCartItemQty(${idx}, this.value)" class="w-14 p-1 border border-slate-300 rounded text-center font-bold">
                            <span class="font-black text-slate-800 w-16 text-right">₹${item.qty * item.rate}</span>
                            <button onclick="app.removeCartItem(${idx})" class="text-red-500 p-1"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    </div>
                `).join('');

                this.updateCartTotals();
            }

            updateCartItemQty(idx, val) {
                const qty = parseFloat(val) || 1;
                this.cart[idx].qty = qty;
                this.renderCartItems();
            }

            removeCartItem(idx) {
                this.cart.splice(idx, 1);
                this.renderCartItems();
            }

            clearCart() {
                this.cart = [];
                this.renderCartItems();
            }

            updateCartTotals() {
                const total = this.cart.reduce((a, b) => a + (b.qty * b.rate), 0);
                document.getElementById('cart-total-amount').innerText = '₹' + total.toLocaleString('en-IN');
                
                const paidInput = document.getElementById('cartPaidAmount');
                if (!paidInput.value) paidInput.value = total;

                const paid = parseFloat(paidInput.value) || 0;
                const due = Math.max(0, total - paid);
                document.getElementById('cartDueAmount').value = due.toFixed(2);
            }

            async checkoutSale() {
                if (this.cart.length === 0) {
                    this.toast('Cart is empty!', 'error');
                    return;
                }

                const customerId = document.getElementById('posCustomerId').value;
                const paidAmount = parseFloat(document.getElementById('cartPaidAmount').value) || 0;
                const totalAmount = this.cart.reduce((a, b) => a + (b.qty * b.rate), 0);
                const dueAmount = Math.max(0, totalAmount - paidAmount);

                const sale = {
                    billNo: 'SBB-' + Math.floor(10000 + Math.random() * 90000),
                    date: new Date().toISOString().split('T')[0],
                    customerId: customerId || null,
                    items: this.cart,
                    netTotal: totalAmount,
                    paidAmount,
                    dueAmount,
                    createdAt: new Date().toISOString()
                };

                // Save Sale Record
                await this.db.save('sales', sale);

                // Update Product Stocks
                for (let item of this.cart) {
                    const prod = await this.db.get('products', item.productId);
                    if (prod) {
                        prod.currentStock -= item.qty;
                        await this.db.save('products', prod);

                        await this.db.save('stock_ledger', {
                            date: sale.date,
                            productId: prod.id,
                            productName: prod.name,
                            type: 'Sale Out',
                            ref: `Bill #${sale.billNo}`,
                            inQty: 0,
                            outQty: item.qty,
                            balance: prod.currentStock,
                            createdAt: new Date().toISOString()
                        });
                    }
                }

                // If Customer Selected and Due Amount > 0, Update Ledger
                if (customerId && dueAmount > 0) {
                    const cust = await this.db.get('customers', customerId);
                    if (cust) {
                        cust.outstanding = (cust.outstanding || 0) + dueAmount;
                        await this.db.save('customers', cust);
                    }
                }

                this.toast('Sale invoice generated successfully!');
                this.renderInvoicePrintModal(sale);
                this.clearCart();
            }

                const html = `
                    <div class="space-y-6">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                            <div>
                                <h2 class="text-2xl font-black text-slate-800">Stock Register & Reports</h2>
                                <p class="text-slate-500 text-sm">Official Traditional Shop Stock Ledger Register</p>
                            </div>
                            <button onclick="window.print()" class="btn-3d text-white px-4 py-2.5 rounded-xl font-bold text-sm flex items-center gap-2">
                                <i class="fa-solid fa-file-pdf"></i> Print Stock Register
                            </button>
                        </div>

                        <div class="card-3d p-6 space-y-4" id="printable-area">
                            <div class="text-center border-b pb-4">
                                <h1 class="text-2xl font-black text-agri-900">${this.settings.shopName}</h1>
                                <p class="text-xs text-slate-600 font-semibold">${this.settings.address}</p>
                                <h3 class="text-sm font-extrabold text-amber-600 mt-2 uppercase tracking-widest">OFFICIAL PHYSICAL STOCK REGISTER</h3>
                            </div>

                            <div class="overflow-x-auto">
                                <table class="w-full text-left border-collapse text-xs border border-slate-300">
                                    <thead>
                                        <tr class="bg-slate-200 text-slate-800 font-black border-b border-slate-300 uppercase">
                                            <th class="p-2 border-r">S.No</th>
                                            <th class="p-2 border-r">Product</th>
                                            <th class="p-2 border-r">Category</th>
                                            <th class="p-2 border-r text-center">Unit</th>
                                            <th class="p-2 border-r text-right">Closing Qty</th>
                                            <th class="p-2 border-r text-right">Purchase Rate (₹)</th>
                                            <th class="p-2 text-right">Stock Value (₹)</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-200">
                                        ${products.map((p, idx) => {
                                            const val = (p.currentStock || 0) * (p.purchasePrice || 0);
                                            return `
                                                <tr class="hover:bg-slate-50">
                                                    <td class="p-2 border-r font-bold">${idx + 1}</td>
                                                    <td class="p-2 border-r font-bold text-slate-800">${p.name}</td>
                                                    <td class="p-2 border-r">${p.category}</td>
                                                    <td class="p-2 border-r text-center font-bold">${p.unit}</td>
                                                    <td class="p-2 border-r text-right font-black ${p.currentStock <= p.minStock ? 'text-red-600' : ''}">${p.currentStock || 0}</td>
                                                    <td class="p-2 border-r text-right">₹${p.purchasePrice || 0}</td>
                                                    <td class="p-2 text-right font-black text-agri-800">₹${val.toLocaleString('en-IN')}</td>
                                                </tr>
                                            `;
                                        }).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;

                document.getElementById('view-container').innerHTML = html;
            }

            async renderSettings() {
                const html = `
                    <div class="space-y-6 max-w-3xl">
                        <div>
                            <h2 class="text-2xl font-black text-slate-800">Settings & Database Backup</h2>
                            <p class="text-slate-500 text-sm">Shop Information & Local JSON Backup/Restore</p>
                        </div>

                        <!-- Shop Info Form -->
                        <div class="card-3d p-5 space-y-4">
                            <h3 class="font-extrabold text-slate-800 text-base border-b pb-2">Shop Profile</h3>
                            <div class="space-y-3">
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Shop Name</label>
                                    <input type="text" id="cfgShopName" value="${this.settings.shopName}" class="w-full p-2 border border-slate-300 rounded-xl text-sm font-bold">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Address</label>
                                    <input type="text" id="cfgAddress" value="${this.settings.address}" class="w-full p-2 border border-slate-300 rounded-xl text-sm font-medium">
                                </div>
                                <div class="grid grid-cols-2 gap-3">
                                    <div>
                                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Phone</label>
                                        <input type="text" id="cfgPhone" value="${this.settings.phone}" class="w-full p-2 border border-slate-300 rounded-xl text-sm font-medium">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">GSTIN</label>
                                        <input type="text" id="cfgGstin" value="${this.settings.gstin}" class="w-full p-2 border border-slate-300 rounded-xl text-sm font-medium">
                                    </div>
                                </div>
                                <button onclick="app.saveSettingsConfig()" class="btn-3d text-white px-5 py-2 rounded-xl text-sm font-bold">Save Shop Details</button>
                            </div>
                        </div>

                        <!-- Backup & Restore -->
                        <div class="card-3d p-5 space-y-4">
                            <h3 class="font-extrabold text-slate-800 text-base border-b pb-2">Data Backup & Restore</h3>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div class="p-4 bg-agri-50 rounded-2xl border border-agri-200 space-y-2">
                                    <h4 class="font-bold text-agri-900 text-sm">Export Local Backup</h4>
                                    <p class="text-xs text-agri-700">Downloads all data safely as JSON file to your device memory.</p>
                                    <button onclick="app.exportDatabaseBackup()" class="btn-3d text-white px-4 py-2 rounded-xl text-xs font-bold w-full"><i class="fa-solid fa-download mr-1"></i> Export JSON Backup</button>
                                </div>
                                <div class="p-4 bg-amber-50 rounded-2xl border border-amber-200 space-y-2">
                                    <h4 class="font-bold text-amber-900 text-sm">Restore JSON Backup</h4>
                                    <p class="text-xs text-amber-700">Upload a saved backup file to restore database.</p>
                                    <input type="file" id="restore-file-input" class="hidden" accept=".json" onchange="app.importDatabaseBackup(event)">
                                    <button onclick="document.getElementById('restore-file-input').click()" class="btn-3d-amber text-white px-4 py-2 rounded-xl text-xs font-bold w-full"><i class="fa-solid fa-upload mr-1"></i> Restore Backup File</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                document.getElementById('view-container').innerHTML = html;
            }

            async saveSettingsConfig() {
                this.settings.shopName = document.getElementById('cfgShopName').value.trim();
                this.settings.address = document.getElementById('cfgAddress').value.trim();
                this.settings.phone = document.getElementById('cfgPhone').value.trim();
                this.settings.gstin = document.getElementById('cfgGstin').value.trim();

                await this.db.save('settings', { id: 'config', ...this.settings });
                this.toast('Settings saved successfully!');
            }

            async exportDatabaseBackup() {
                const data = {
                    products: await this.db.getAll('products'),
                    distributors: await this.db.getAll('distributors'),
                    customers: await this.db.getAll('customers'),
                    purchases: await this.db.getAll('purchases'),
                    sales: await this.db.getAll('sales'),
                    payments: await this.db.getAll('payments'),
                    stock_ledger: await this.db.getAll('stock_ledger'),
                    settings: this.settings
                };

                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `SBB_Backup_${new Date().toISOString().split('T')[0]}.json`;
                a.click();
            }

            async importDatabaseBackup(e) {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = async (event) => {
                    try {
                        const data = JSON.parse(event.target.result);
                        if (confirm('This will replace current local database. Proceed?')) {
                            await this.db.clearAll();
                            for (let key of Object.keys(data)) {
                                if (Array.isArray(data[key])) {
                                    for (let item of data[key]) {
                                        await this.db.save(key, item);
                                    }
                                }
                            }
                            this.toast('Database restored successfully!');
                            this.navigate('dashboard');
                        }
                    } catch (err) {
                        this.toast('Invalid Backup File Format!', 'error');
                    }
                };
                reader.readAsText(file);
            }

            loadSampleDataPrompt() {
                if (confirm('Pre-fill shop with realistic sample Seeds, Fertilizers, Pesticides & Distributors?')) {
                    this.loadSampleData();
                }
            }

            async loadSampleData() {
                await this.db.clearAll();

                // Distributors
                const d1 = await this.db.save('distributors', { firmName: 'Onkar Seed Industries', place: 'Karnal', phone: '9812345678', gstin: '06AAAC0000A1Z1', outstanding: 14500 });
                const d2 = await this.db.save('distributors', { firmName: 'IFFCO Fertilizer Hub', place: 'Delhi', phone: '9876543210', gstin: '07AAACI0000A1Z2', outstanding: 0 });

                // Products
                const p1 = await this.db.save('products', { name: 'Wheat Seed HD-2967', category: 'Seeds', unit: 'bag', purchasePrice: 850, salePrice: 950, currentStock: 80, minStock: 10, gstRate: 0 });
                const p2 = await this.db.save('products', { name: 'DAP Fertilizer 50kg', category: 'Fertilizers', unit: 'bag', purchasePrice: 1300, salePrice: 1350, currentStock: 4, minStock: 10, gstRate: 5 });
                const p3 = await this.db.save('products', { name: 'Chlorpyrifos Pesticide 1L', category: 'Pesticides', unit: 'bottle', purchasePrice: 450, salePrice: 550, currentStock: 25, minStock: 5, gstRate: 18 });

                // Stock Movement Records
                await this.db.save('stock_ledger', { date: new Date().toISOString().split('T')[0], productId: p1.id, productName: p1.name, type: 'Opening Stock', ref: 'Initial', inQty: 80, outQty: 0, balance: 80, createdAt: new Date().toISOString() });
                await this.db.save('stock_ledger', { date: new Date().toISOString().split('T')[0], productId: p2.id, productName: p2.name, type: 'Opening Stock', ref: 'Initial', inQty: 4, outQty: 0, balance: 4, createdAt: new Date().toISOString() });

                // Farmers
                await this.db.save('customers', { name: 'Ramesh Singh', village: 'Rampur', phone: '9988776655', outstanding: 1200 });

                this.toast('Sample data pre-loaded successfully!');
                this.navigate('dashboard');
            }
        }

        // Initialize App
        const app = new Application();
        window.onload = () => app.init();
    </script>
</body>
</html>
